spring.application.name=API-GATEWAY
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Route 1: Send /hello requests to FIRST-MICROSERVICE
spring.cloud.gateway.routes[0].id=first-microservice-route
spring.cloud.gateway.routes[0].uri=lb://FIRST-MICROSERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/hello/**

# Route 2: Send /call-first requests to SECOND-MICROSERVICE
spring.cloud.gateway.routes[1].id=second-microservice-route
spring.cloud.gateway.routes[1].uri=lb://SECOND-MICROSERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/call-first/**

# Route 3: Send /call-product requests to second_microservice
spring.cloud.gateway.routes[2].id=product-route
spring.cloud.gateway.routes[2].uri=lb://second-microservice
spring.cloud.gateway.routes[2].predicates[0]=Path=/call-product/**